# ==================================================================
# StudyHelper 业务服务 Docker Compose
# 包含：反向代理、业务后端、数据库、缓存、对象存储、代码沙箱
# ==================================================================

services:
  # ----------------------------------------------------------------
  # 反向代理：Nginx
  # 统一入口：前端静态文件 + API 代理 + SSE 超时配置
  # Sprint 3 前端构建完成后启动：docker compose --profile frontend up -d
  # ----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: always
    profiles:
      - frontend
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 前端 H5 构建产物（Uni-app 编译输出目录）
      - ../frontend/dist/build/h5:/usr/share/nginx/html:ro
      # 静态资源：上传图片和沙箱生成图片（与 backend 共享同一 named volume）
      - assets_data:/usr/share/nginx/assets:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
        required: false
    networks:
      - studyhelper_net

  # ----------------------------------------------------------------
  # 业务后端：FastAPI
  # 鉴权、数据持久化、Agent 编排、代码沙箱调度
  # 启动：docker compose --profile backend up -d
  # ----------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles:
      - backend
    restart: always
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的容器间通信地址（容器内使用服务名，不用 localhost）
      - DB_HOST=business_db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      business_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend:/app
      # 挂载 Docker socket，使 backend 可通过 Docker SDK 启动/管理沙箱容器
      - /var/run/docker.sock:/var/run/docker.sock
      # 静态资源：上传图片和沙箱生成图片（与 nginx 共享同一 named volume）
      - assets_data:/tmp/studyhelper-assets
    networks:
      - studyhelper_net

  # ----------------------------------------------------------------
  # 业务数据库：PostgreSQL + pgvector
  # 存储用户、会话、消息等业务数据，以及向量检索
  # ----------------------------------------------------------------
  business_db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${BUSINESS_DB_USER:-studyhelper}
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD:-studyhelper123}
      POSTGRES_DB: ${BUSINESS_DB_NAME:-studyhelper}
    volumes:
      - business_db_data:/var/lib/postgresql/data
    ports:
      - "${BUSINESS_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUSINESS_DB_USER:-studyhelper} -d ${BUSINESS_DB_NAME:-studyhelper}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - studyhelper_net

  # ----------------------------------------------------------------
  # 缓存：Redis
  # SSE 连接管理、用户会话/Token、接口限流
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    environment:
      # 供 healthcheck 中 REDISCLI_AUTH 使用，避免密码出现在进程命令行
      REDIS_PASSWORD: ${REDIS_PASSWORD:-studyhelper123}
    command: redis-server --requirepass ${REDIS_PASSWORD:-studyhelper123} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - studyhelper_net

  # ----------------------------------------------------------------
  # 对象存储：MinIO（兼容 S3 协议）
  # 存储用户上传的图片、沙箱生成的几何图形等
  # ----------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studyhelper_net

  # ----------------------------------------------------------------
  # 代码沙箱：执行 AI 生成的 Python 绘图代码
  # 安全隔离：无网络、只读文件系统、资源限制、执行超时
  # 按需启动（profiles: sandbox），不在 compose up 时自动运行
  # FastAPI 通过 Docker SDK 按需 docker run 启动，docker cp 提取图片，docker rm 销毁
  # ----------------------------------------------------------------
  code_sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    restart: "no"
    profiles:
      - sandbox
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:suid,size=256m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

volumes:
  business_db_data:
  redis_data:
  minio_data:
  assets_data:

networks:
  studyhelper_net:
    external: true
